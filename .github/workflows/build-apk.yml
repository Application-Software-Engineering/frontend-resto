name: Build Flutter APK

on:
  push:
    branches: [ UIMerge ]
  pull_request:
    branches: [ UIMerge ]
  workflow_dispatch:  # Allow manual trigger

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.2'  # Adjust to your Flutter version
          channel: 'stable'
      
      - name: Get dependencies
        run: flutter pub get
      
      - name: Analyze code
        run: flutter analyze
        continue-on-error: true  # Don't fail build on analysis warnings
      
      - name: Build APK (split per ABI)
        run: flutter build apk --split-per-abi --release
      
      - name: Build APK (universal)
        run: flutter build apk --release
      
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apk-builds
          path: |
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
            build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
      
      - name: Create Release Info
        run: |
          echo "## Build Information" > build-info.txt
          echo "Build Date: $(date)" >> build-info.txt
          echo "Flutter Version: $(flutter --version | head -n 1)" >> build-info.txt
          echo "Commit: ${{ github.sha }}" >> build-info.txt
          ls -lh build/app/outputs/flutter-apk/*.apk >> build-info.txt
      
      - name: Upload Build Info
        uses: actions/upload-artifact@v4
        with:
          name: build-info
          path: build-info.txt
